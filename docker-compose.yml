services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: loja-carros-app
    working_dir: /app
    volumes:
      - .:/app
      - ./php.ini:/usr/local/etc/php/conf.d/uploads.ini
    ports:
      - "9000:9000"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=loja_carros
      - DB_USERNAME=root
      - DB_PASSWORD=root
    depends_on:
      - mysql
    networks:
      - loja-carros
    command: php-fpm

  mysql:
    image: mysql:8.0
    container_name: loja-carros-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: loja_carros
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - loja-carros
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  nginx:
    image: nginx:alpine
    container_name: loja-carros-nginx
    ports:
      - "80:80"
    volumes:
      - .:/app
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - loja-carros

volumes:
  mysql_data:

networks:
  loja-carros:
    driver: bridge